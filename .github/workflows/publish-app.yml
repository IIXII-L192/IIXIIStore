name: Publish app from issue

on:
  issues:
    types: [labeled]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Issue number to publish
        required: true
        type: number

permissions:
  contents: write
  issues: write

concurrency:
  group: publish-iixiistore-catalogue
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issues' && github.event.label.name == 'publish-app')
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve and validate issue
        id: issue
        env:
          GH_TOKEN: ${{ github.token }}
          DISPATCH_ISSUE: ${{ inputs.issue_number }}
          EVENT_ISSUE: ${{ github.event.issue.number }}
        run: |
          set -euo pipefail
          ISSUE_NUMBER="${DISPATCH_ISSUE:-${EVENT_ISSUE:-}}"
          test -n "$ISSUE_NUMBER"
          echo "number=$ISSUE_NUMBER" >> "$GITHUB_OUTPUT"

          gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --json body --jq .body > issue-body.md

          LABELS="$(gh issue view "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name')"
          if ! grep -Fxq "app-submission" <<< "$LABELS"; then
            echo "Issue #$ISSUE_NUMBER is not an app-submission issue." >&2
            exit 1
          fi

      - name: Publish catalogue entry
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.issue.outputs.number }}
        run: |
          set -uo pipefail

          gh label create published --repo "$GITHUB_REPOSITORY" --color 1F883D --description "Published to the live catalogue" --force
          gh label create publication-failed --repo "$GITHUB_REPOSITORY" --color D1242F --description "Catalogue publication failed" --force
          gh label create publish-app --repo "$GITHUB_REPOSITORY" --color 8250DF --description "Approve and publish this app" --force

          python3 .github/scripts/publish_app.py \
            --issue-body issue-body.md \
            --registry catalog/registry.json \
            --issue-number "$ISSUE_NUMBER" \
            > publish-result.md 2>&1
          STATUS=$?

          if [ "$STATUS" -ne 0 ]; then
            gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file publish-result.md
            gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --add-label publication-failed
            gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
              --remove-label publish-app || true
            exit "$STATUS"
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add catalog/registry.json
          git commit -m "Publish app from issue #$ISSUE_NUMBER"
          git push

          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file publish-result.md
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --add-label published \
            --state closed
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --remove-label publish-app || true
          gh issue edit "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --remove-label publication-failed || true
