name: Add an app
description: Submit an Android app for inclusion in IIXII Store
title: "[App Submission]: "
labels:
  - app-submission

body:
  - type: markdown
    attributes:
      value: |
        Submit one app per issue.

        Submitting this form does not publish the app automatically.
        A maintainer must review the submission and add the `publish-app` label.

  - type: input
    id: app_name
    attributes:
      label: App name
      placeholder: IIXII Store
    validations:
      required: true

  - type: input
    id: app_id
    attributes:
      label: App ID
      description: A permanent lowercase identifier using letters, numbers, dots, underscores, or hyphens.
      placeholder: iixiistore
    validations:
      required: true

  - type: input
    id: package_name
    attributes:
      label: Android package name
      placeholder: l192.aakarsh.iixiistore
    validations:
      required: true

  - type: input
    id: source
    attributes:
      label: GitHub source repository
      description: The repository whose latest GitHub Release contains the APK.
      placeholder: https://github.com/IIXII-L192/IIXIIStore
    validations:
      required: true

  - type: input
    id: website
    attributes:
      label: Website URL
      description: Optional. Direct HTTPS URL to the app's website.
      placeholder: https://iixiistore.vercel.app
    validations:
      required: false

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A short description shown on the app detail page.
      placeholder: Describe the app and its main purpose.
    validations:
      required: true

  - type: input
    id: icon_url
    attributes:
      label: Icon URL
      description: Enter a direct HTTPS URL to the app icon.
      placeholder: https://example.com/icon.png
    validations:
      required: true

  - type: textarea
    id: screenshot_urls
    attributes:
      label: Screenshot URLs
      description: Optional. Enter one direct HTTPS image URL per line. Any number of screenshots is supported.
      placeholder: |
        https://example.com/screenshot-1.png
        https://example.com/screenshot-2.png
    validations:
      required: false
